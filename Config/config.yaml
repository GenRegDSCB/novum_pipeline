  phocea_massiliensis: Data/Raw/genomes/GCF_900104615.1_PRJEB16353_cds_rna_from_genomic.fna
  blautia_wexlerae: Data/Raw/genomes/GCF_025148125.1_ASM2514812v1_cds_rna_from_genomic.fna
  lawsonibacter_asaccharolyticus: Data/Raw/genomes/GCF_022453915.1_ASM2245391v1_cds_rna_from_genomic.fna
  anaerotruncus_colihominis: Data/Raw/genomes/GCF_025146135.1_ASM2514613v1_cds_rna_from_genomic.fna
